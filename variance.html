<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Interactive visulization of sample variance</title>
		<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=2306cacef998491eae84fd3c83ec36bc"></script>
		<link rel="stylesheet" href="styles.css">
		<style>
			html, body {
				margin: 0;
				width: 100%;
				height: 100%;
			}
			#calculator1,
			#calculator2 {
				width: 100%;
				height: 50%;
				border: 1px solid #ccc;
			}
		</style>
	</head>
	<body>
		<div id="calculator1"></div><div id="calculator2"></div>

		<script>
			const elt1 = document.getElementById('calculator1');
			const calculator1 = Desmos.GraphingCalculator(elt1, {
			  expressions: true,     // Show the expressions list
			  settingsMenu: false,   // Hide settings menu
			  zoomButtons: true,     // Optional: show zoom controls
			  distributions: true    // Load statistics library
			});
			const elt2 = document.getElementById('calculator2');
			const calculator2 = Desmos.GraphingCalculator(elt2, {
			  expressions: true,     // Show the expressions list
			  settingsMenu: false,   // Hide settings menu
			  zoomButtons: true,     // Optional: show zoom controls
			  distributions: true    // Load statistics library
			});


			// Define the initial state of the calculator
			state1 = {
			    "version": 11,
			    "randomSeed": "798da968158997eaa43d433a8d5fd9b0",
			    "graph": {
			        "viewport": {
			            "xmin": -1.5,
			            "ymin": -0.5,
			            "xmax": 1.5,
			            "ymax": 2
			        },
			        "squareAxes": false,
			        "__v12ViewportLatexStash": {
			            "xmin": "-1.5",
			            "xmax": "1.5",
			            "ymin": "-0.5",
			            "ymax": "2"
			        }
			    },
			    "expressions": {
			        "list": [
			            {
			                "type": "folder",
			                "id": "4",
			                "title": "Define a normal distribution",
			                "hidden": false,
			                "collapsed": true
			            },
			            {
			                "type": "expression",
			                "id": "slider_true_parameter1",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "\\mu_{true}=0",
			                "hidden": false,
			                "slider": {
			                    "hardMin": true,
			                    "hardMax": true,
			                    "min": "-1",
			                    "max": "1"
			                }
			            },
			            {
			                "type": "expression",
			                "id": "distribution",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "P=\\operatorname{normaldist}\\left(\\mu_{true},\\sigma_{true}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "show_true_parameter1",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "\\left(\\mu_{true},0\\right)",
			                "showLabel": true,
			                "label": "True",
			                "labelOrientation": "above"
			            },
			            {
			                "type": "expression",
			                "id": "slider_true_parameter2",
			                "folderId": "4",
			                "color": "#2d70b3",
			                "latex": "\\sigma_{true}=0.287",
			                "hidden": false,
			                "slider": {
			                    "hardMin": true,
			                    "hardMax": true,
			                    "min": "0",
			                    "max": "1"
			                }
			            },
			            {
			                "type": "expression",
			                "id": "show_true_parameter2_right",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "\\left(\\mu_{true}+\\sigma_{true},0\\right)",
			                "dragMode": "X"
			            },
			            {
			                "type": "expression",
			                "id": "show_true_parameter2_left",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "\\left(\\mu_{true}-\\sigma_{true},0\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "show_true_parameter2_line",
			                "folderId": "4",
			                "color": "#388c46",
			                "latex": "\\operatorname{polygon}\\left(\\left(\\mu_{true}-\\sigma_{true},0\\right),\\left(\\mu_{true}+\\sigma_{true},0\\right)\\right)",
			                "lineWidth": "10"
			            },
			            {
			                "type": "folder",
			                "id": "5",
			                "title": "Sample the distribution",
			                "collapsed": true
			            },
			            {
			                "type": "expression",
			                "id": "data",
			                "folderId": "5",
			                "color": "#388c46",
			                "latex": "d_{ata}=P.\\operatorname{random}\\left(N\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "number_of_samples",
			                "folderId": "5",
			                "color": "#6042a6",
			                "latex": "N=100",
			                "hidden": false,
			                "slider": {
			                    "hardMin": true,
			                    "hardMax": true,
			                    "min": "1",
			                    "max": "1000",
			                    "step": "1"
			                }
			            },
			            {
			                "type": "expression",
			                "id": "histogram",
			                "folderId": "5",
			                "color": "#2d70b3",
			                "latex": "\\operatorname{histogram}\\left(d_{ata},\\frac{\\sigma_{true}}{3}\\right)",
			                "vizProps": {
			                    "histogramMode": "density"
			                }
			            },
			            {
			                "type": "folder",
			                "id": "6",
			                "title": "Estimate the parameters",
			                "hidden": false,
			                "collapsed": true
			            },
			            {
			                "type": "expression",
			                "id": "mu_sample",
			                "folderId": "6",
			                "color": "#c74440",
			                "latex": "\\mu_{sample}=\\operatorname{mean}\\left(d_{ata}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "show_mu_sample",
			                "folderId": "6",
			                "color": "#2d70b3",
			                "latex": "\\left(\\mu_{sample},-0.1\\right)",
			                "showLabel": true,
			                "label": "Sample",
			                "labelOrientation": "below",
			                "pointSize": "20",
			                "movablePointSize": "20"
			            },
			            {
			                "type": "expression",
			                "id": "sigma_sample",
			                "folderId": "6",
			                "color": "#6042a6",
			                "latex": "\\sigma_{sample}=\\operatorname{stdev}\\left(d_{ata}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "show_sigma_sample",
			                "folderId": "6",
			                "color": "#2d70b3",
			                "latex": "\\operatorname{polygon}\\left(\\left(\\mu_{sample}-\\sigma_{sample},-0.1\\right),\\left(\\mu_{sample}+\\sigma_{sample},-0.1\\right)\\right)",
			                "lineWidth": "10"
			            }
			        ]
			    },
			    "includeFunctionParametersInRandomSeed": true,
			    "doNotMigrateMovablePointStyle": true
			};
			state2 = {
			    "version": 11,
			    "randomSeed": "809d8925ab59b0574309762208b3a4ae",
			    "graph": {
			        "viewport": {
			            "xmin": -0.14999999999999997,
			            "ymin": -0.06104095491895867,
			            "xmax": 0.45,
			            "ymax": 0.30895904508104133
			        },
			        "squareAxes": false,
			        "__v12ViewportLatexStash": {
			            "xmin": "-0.14999999999999997",
			            "xmax": "0.45",
			            "ymin": "-0.06104095491895867",
			            "ymax": "0.30895904508104133"
			        }
			    },
			    "expressions": {
			        "list": [
			            {
			                "type": "folder",
			                "id": "13",
			                "title": "Mean",
			                "collapsed": true
			            },
			            {
			                "type": "expression",
			                "id": "collected_mu",
			                "folderId": "13",
			                "color": "#c74440",
			                "latex": "\\mu_{samples}=\\left[ \\right]"
			            },
			            {
			                "type": "expression",
			                "id": "mu_histogram",
			                "folderId": "13",
			                "color": "#388c46",
			                "latex": "\\operatorname{histogram}\\left(\\mu_{samples},\\frac{\\operatorname{stdev}\\left(\\mu_{samples}\\right)}{3}\\right)",
			                "vizProps": {
			                    "histogramMode": "relative"
			                }
			            },
			            {
			                "type": "expression",
			                "id": "2",
			                "folderId": "13",
			                "color": "#000000",
			                "latex": "\\mu=\\operatorname{mean}\\left(\\mu_{samples}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "3",
			                "folderId": "13",
			                "color": "#c74440",
			                "latex": "\\sigma_{mu}=\\operatorname{stdev}\\left(\\mu_{samples}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "6",
			                "folderId": "13",
			                "color": "#388c46",
			                "latex": "\\operatorname{polygon}\\left(\\left(\\mu-\\sigma_{mu},0\\right),\\left(\\mu+\\sigma_{mu},0\\right)\\right)",
			                "lineWidth": "10"
			            },
			            {
			                "type": "expression",
			                "id": "4",
			                "folderId": "13",
			                "color": "#388c46",
			                "latex": "\\left(\\mu,0\\right)",
			                "pointOutline": true,
			                "pointSize": "18",
			                "movablePointSize": "18"
			            },
			            {
			                "type": "folder",
			                "id": "12",
			                "title": "Standard deviation",
			                "collapsed": true
			            },
			            {
			                "type": "expression",
			                "id": "collected_sigma",
			                "folderId": "12",
			                "color": "#2d70b3",
			                "latex": "\\sigma_{samples}=\\left[ \\right]"
			            },
			            {
			                "type": "expression",
			                "id": "sigma_histogram",
			                "folderId": "12",
			                "color": "#6042a6",
			                "latex": "\\operatorname{histogram}\\left(\\sigma_{samples},\\frac{\\operatorname{stdev}\\left(\\sigma_{samples}\\right)}{3}\\right)",
			                "vizProps": {
			                    "histogramMode": "relative"
			                }
			            },
			            {
			                "type": "expression",
			                "id": "7",
			                "folderId": "12",
			                "color": "#000000",
			                "latex": "\\mu_{sigma}=\\operatorname{mean}\\left(\\sigma_{samples}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "9",
			                "folderId": "12",
			                "color": "#2d70b3",
			                "latex": "\\sigma_{sigma}=\\operatorname{stdev}\\left(\\sigma_{samples}\\right)"
			            },
			            {
			                "type": "expression",
			                "id": "11",
			                "folderId": "12",
			                "color": "#6042a6",
			                "latex": "\\operatorname{polygon}\\left(\\left(\\mu_{sigma}-\\sigma_{sigma},0\\right),\\left(\\mu_{sigma}+\\sigma_{sigma},0\\right)\\right)",
			                "lineWidth": "10"
			            },
			            {
			                "type": "expression",
			                "id": "10",
			                "folderId": "12",
			                "color": "#6042a6",
			                "latex": "\\left(\\mu_{sigma},0\\right)",
			                "pointOutline": true,
			                "pointSize": "18",
			                "movablePointSize": "18"
			            }
			        ]
			    },
			    "includeFunctionParametersInRandomSeed": true,
			    "doNotMigrateMovablePointStyle": true
			};

			// Load the JSON state
			calculator1.setState(state1);
			calculator2.setState(state2);

			function append(list, value) {
			  // Find the collection of sample means
			  const latex = calculator2.getExpressions().find(e => e.id === list).latex;
			  if (!list) return;

			  // Parse the numeric list, which looks like: <list name>=\left[1.23,4.56\right]
			  const [name, string] = latex.split("=");
			  const match = string.match(/\\left\[(.*)\\right\]/);
			  let values = [];
			  if (match && match[1].trim() !== "") {
				values = match[1].split(',').map(Number);
			  }

			  // Append the new mean and stdev
			  values.push(calculator1.expressionAnalysis[value].evaluation.value);

			  // Build new latex string
			  const newLatex = `${name}=\\left[${values.join(",")}\\right]`;

			  // Update the expression in Desmos
			  calculator2.setExpression({
				id: list,
				latex: newLatex
			  });
			}

			var sigma_sample = calculator1.HelperExpression({"latex": "\\sigma_{sample}"});
			var mu_sample = calculator1.HelperExpression({"latex": "\\mu_{sample}"});
			mu_sample.observe('numericValue', function () {
			  append("collected_mu", "mu_sample")
			});
			sigma_sample.observe('numericValue', function () {
			  append("collected_sigma", "sigma_sample")
			});
		</script>
	</body>
</html>
